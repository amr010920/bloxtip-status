<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Live System Status</title>
    <style>
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; background: #f4f5f7; color: #333; max-width: 600px; margin: 40px auto; padding: 20px; }
        h1 { font-size: 24px; margin-bottom: 5px; }
        .subtitle { color: #6b778c; font-size: 14px; margin-bottom: 25px; }
        .card { background: white; padding: 20px; border-radius: 8px; box-shadow: 0 4px 6px rgba(0,0,0,0.05); }
        .system-row { display: flex; justify-content: space-between; align-items: center; padding: 15px 0; }
        .status-info { display: flex; flex-direction: column; align-items: flex-end; }
        .status-badge { padding: 4px 10px; border-radius: 12px; font-size: 13px; font-weight: bold; text-transform: uppercase; }
        .ms-delay { font-size: 11px; color: #6b778c; margin-top: 4px; }
        
        .operational { background: #e6f6ec; color: #00875a; }
        .slow { background: #fffae6; color: #ffab00; }
        .outage { background: #ffebe6; color: #de350b; }
    </style>
</head>
<body>

    <h1>System Status</h1>
    <div class="subtitle">Checking live status every 10 seconds...</div>

    <div class="card">
        <div class="system-row">
            <div>
                <strong style="font-size: 18px;">Main Website</strong>
                <div style="font-size: 12px; color: #6b778c;" id="web-url">Loading...</div>
            </div>
            <div class="status-info">
                <span id="status-badge" class="status-badge operational">Checking...</span>
                <span id="ping-time" class="ms-delay">-- ms</span>
            </div>
        </div>
    </div>

    <script>
        const TARGET_URL = 'https://amr010920.github.io/bloxtip/';

        document.getElementById('web-url').innerText = TARGET_URL;

        async function checkWebsiteLive() {
            const badge = document.getElementById('status-badge');
            const pingText = document.getElementById('ping-time');
            
            const startTime = performance.now();

            try {
                const uniqueUrl = `${TARGET_URL}?t=${Date.now()}`;
                
                await fetch(uniqueUrl, { 
                    mode: 'no-cors',
                    cache: 'no-store'
                });

                const endTime = performance.now();
                const duration = Math.round(endTime - startTime);

                pingText.innerText = `${duration} ms response`;

                if (duration > 1500) { 
                    badge.innerText = "Slow Connection";
                    badge.className = "status-badge slow";
                } else {
                    badge.innerText = "Operational";
                    badge.className = "status-badge operational";
                }

            } catch (error) {
                badge.innerText = "Major Outage";
                badge.className = "status-badge outage";
                pingText.innerText = "Offline";
            }
        }

        checkWebsiteLive();

        setInterval(checkWebsiteLive, 10000);
    </script>
</body>
</html>
